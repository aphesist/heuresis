[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heuresis"
version = "0.1.0"
description = "A cost-ordered, time-aware, verified-and-abstaining retrieval engine, with a pre-registered benchmark against standard RAG and agentic search."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
local = ["onnxruntime>=1.17", "tokenizers>=0.15", "huggingface_hub>=0.23"]
bench = ["datasets>=2.19"]
dev = ["pytest>=8", "hypothesis>=6"]

[project.scripts]
heuresis = "heuresis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
heuresis = ["surface/*.json", "surface/*.txt", "v2/surface/*.json", "v2/surface/prompts/*.txt", "v2/locked/*.json", "v2/calibration/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
